name: GitPulse 24-7 Random Automated Commits

on:
  schedule:
    # Runs at varying randomized minute marks throughout the day (8 times a day: every ~3 hours)
    - cron: "17 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch: # Allows manual click 'Run workflow' from GitHub Actions UI

concurrency:
  group: gitpulse-heartbeat
  cancel-in-progress: false

jobs:
  auto-commit:
    name: Execute 24/7 Random Heartbeat
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitPulse Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_COMMIT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Randomized Human Jitter Delay
        run: |
          # Sleep between 20 and 420 seconds (random minutes) to ensure natural human commit timing
          RANDOM_DELAY=$(( ( RANDOM % 400 ) + 20 ))
          echo "Simulating human timing: sleeping for ${RANDOM_DELAY} seconds..."
          sleep $RANDOM_DELAY

      - name: Run Auto-Commit Engine
        env:
          AUTO_COMMIT_TOKEN: ${{ secrets.AUTO_COMMIT_TOKEN }}
          TARGET_FILE: ".github-pulse.md"
        run: |
          node scripts/run-pulse.mjs

      - name: Persist Daily Stats Tracker
        run: |
          git config user.name "Yashraj Deshmukh"
          git config user.email "contactysrj@gmail.com"
          git add stats/
          git commit -m "chore(stats): update daily pulse activity log [skip ci]" || echo "No stats changes to commit"
          git push origin main || echo "Stats push skipped"
